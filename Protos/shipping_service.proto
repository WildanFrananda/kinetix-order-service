syntax = "proto3";

package shipping.v1;

option csharp_namespace = "Kinetix.OrderService.Grpc.Shipping";

service ShippingService {
  rpc EstimateShippingOptions (EstimateShippingOptionsRequest) returns (EstimateShippingOptionsResponse);
}

message LocationCoordinates {
  double latitude = 1;
  double longitude = 2;
}

message EstimateShippingOptionsRequest {
  LocationCoordinates origin = 1;
  LocationCoordinates destination = 2;
  double total_weight_kg = 3;
  int64 merchant_id = 4;
}

message CourierOption {
  string service_tier = 1;
  string service_name = 2;
  double distance_km = 3;
  double base_shipping_fee = 4;
  string estimated_delivery_time = 5;
  bool is_available = 6;
  string unavailable_reason = 7;
}

message EstimateShippingOptionsResponse {
  double distance_km = 1;
  repeated CourierOption options = 2;
}

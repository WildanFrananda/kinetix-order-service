syntax = "proto3";

package pricing.v1;

option csharp_namespace = "Kinetix.OrderService.Grpc.Pricing";
option go_package = "pricing/v1;pricingv1";
option java_multiple_files = true;
option java_package = "com.kinetix.pricing.v1";

message PriceItemRequest {
  string product_id = 1;
  optional string category_id = 2;
  string base_price = 3;
  int32 quantity = 4;
}

message CalculatePriceRequest {
  repeated PriceItemRequest items = 1;
  optional string voucher_code = 2;
  optional string base_shipping_fee = 3;
  optional string payment_method = 4;
}

message PriceItemResponse {
  string product_id = 1;
  string base_price = 2;
  string final_unit_price = 3;
  int32 quantity = 4;
  string line_total = 5;
  optional string applied_flash_sale = 6;
  optional string applied_discount = 7;
}

message CalculatePriceResponse {
  string subtotal = 1;
  string total_discount = 2;
  string voucher_discount = 3;
  string final_total = 4;
  optional string applied_voucher = 5;
  repeated PriceItemResponse items = 6;
  string base_shipping_fee = 7;
  string shipping_discount = 8;
  string final_shipping_fee = 9;
  string payment_discount = 10;
}

service PricingService {
  rpc CalculatePrice (CalculatePriceRequest) returns (CalculatePriceResponse);
}

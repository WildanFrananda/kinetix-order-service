version: '3.8'

services:
  kinetix-order-postgres:
    image: postgres:16-alpine
    container_name: kinetix-order-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kinetix_order_dev
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kinetix-order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-order-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=Host=kinetix-order-postgres;Port=5432;Database=kinetix_order_dev;Username=postgres;Password=postgrespassword
      - REDIS_CONNECTION_STRING=kinetix-redis:6379,password=kinetix_redis_pass
    depends_on:
      kinetix-order-postgres:
        condition: service_healthy
    restart: always

volumes:
  order_postgres_data:

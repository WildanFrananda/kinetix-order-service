version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: daily
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps(docker)"
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/tests"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # The MSBuild pins in Kinetix.OrderService.csproj are security pins for EF's design-time tools.
    # MSBuild 18.11 refuses net10.0 ("upgrade your TargetFramework to net11.0"), so its majors wait for
    # the move off .NET 10; patches on 17.14 still come through.
    ignore:
      - dependency-name: "Microsoft.Build.*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
